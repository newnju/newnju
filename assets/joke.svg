<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 520 130" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="1" y="1" width="518" height="128" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="24" y="34" font-size="15" font-weight="700" fill="#e3b341">&#128514; Dev Joke</text><text x="24" y="64" font-size="14" fill="#c9d1d9">Why do programmers prefer dark mode?<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.293;0.313;1" dur="15.0s" repeatCount="indefinite"/></text><text x="24" y="90" font-size="14" fill="#8b949e">Because light attracts bugs.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.293;0.313;1" dur="15.0s" repeatCount="indefinite"/></text><text x="24" y="64" font-size="14" fill="#c9d1d9">A SQL query walks into a bar,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.627;0.647;1" dur="15.0s" repeatCount="indefinite"/></text><text x="24" y="90" font-size="14" fill="#8b949e">walks up to two tables and asks: can I join you?<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.627;0.647;1" dur="15.0s" repeatCount="indefinite"/></text><text x="24" y="64" font-size="14" fill="#c9d1d9">There are 10 types of people:<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.960;0.980;1" dur="15.0s" repeatCount="indefinite"/></text><text x="24" y="90" font-size="14" fill="#8b949e">those who get binary, and those who don&#x27;t.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.960;0.980;1" dur="15.0s" repeatCount="indefinite"/></text></svg>
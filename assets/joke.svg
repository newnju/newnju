<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><linearGradient id="jSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="800" height="200" fill="#161b22"/><rect x="1" y="1" width="798" height="198" rx="16" fill="none" stroke="#30363d"/><rect x="1" y="1" width="5" height="198" rx="2.5" fill="#e3b341" opacity="0.85"/><text x="28" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e3b341">&#128514; Dev Joke</text><rect x="28" y="50" width="744" height="1" fill="#30363d" opacity="0.7"/><text x="28" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9" opacity="0">Why do programmers prefer dark mode?<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0120;0.3213;0.3333;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="28" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#36BCF7" opacity="0">Because light attracts bugs.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0120;0.3213;0.3333;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="772" y="40" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="10" fill="#8b949e" opacity="0">1 / 3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0120;0.3213;0.3333;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="28" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9" opacity="0">A SQL query walks into a bar,<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3453;0.6547;0.6667;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="28" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#36BCF7" opacity="0">walks up to two tables and asks: can I join you?<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3453;0.6547;0.6667;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="772" y="40" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="10" fill="#8b949e" opacity="0">2 / 3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3453;0.6547;0.6667;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="28" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c9d1d9" opacity="0">There are 10 types of people:<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6787;0.9880;0.9999;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="28" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#36BCF7" opacity="0">those who understand binary, and those who don&#x27;t.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6787;0.9880;0.9999;1.0000" dur="15.0s" repeatCount="indefinite"/></text><text x="772" y="40" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="10" fill="#8b949e" opacity="0">3 / 3<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6787;0.9880;0.9999;1.0000" dur="15.0s" repeatCount="indefinite"/></text><circle cx="28" cy="174" r="3.4" fill="#30363d"/><circle cx="28" cy="174" r="3.4" fill="#e3b341" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0120;0.3213;0.3333;1.0000" dur="15.0s" repeatCount="indefinite"/></circle><circle cx="44" cy="174" r="3.4" fill="#30363d"/><circle cx="44" cy="174" r="3.4" fill="#e3b341" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3333;0.3453;0.6547;0.6667;1.0000" dur="15.0s" repeatCount="indefinite"/></circle><circle cx="60" cy="174" r="3.4" fill="#30363d"/><circle cx="60" cy="174" r="3.4" fill="#e3b341" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6667;0.6787;0.9880;0.9999;1.0000" dur="15.0s" repeatCount="indefinite"/></circle><g clip-path="inset(0 round 16px)"><rect x="-200" y="0" width="160" height="200" fill="url(#jSheen)" transform="skewX(-16)"><animateTransform attributeName="transform" type="translate" values="0 0;1100 0;1100 0" keyTimes="0;0.5;1" dur="11s" repeatCount="indefinite" additive="sum"/></rect></g></svg>
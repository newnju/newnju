<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="1" y="1" width="418" height="198" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="1" y="1" width="418" height="30" rx="16" fill="#0b0f1a"/><circle cx="22" cy="16" r="6" fill="#f85149"/><circle cx="42" cy="16" r="6" fill="#e3b341"/><circle cx="62" cy="16" r="6" fill="#3fb950"/><text x="20" y="64" font-family="monospace" font-size="13" fill="#bc8cff">$ <tspan fill="#c9d1d9">git commit -m "</tspan><tspan fill="#3fb950">ship it</tspan><tspan fill="#c9d1d9">"</tspan></text><text x="20" y="92" font-family="monospace" font-size="13" fill="#58a6ff">def hello():<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.00;0.13;1" dur="3s" repeatCount="indefinite"/></text><text x="20" y="116" font-family="monospace" font-size="13" fill="#3fb950">    return 'world'<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.40;1" dur="3s" repeatCount="indefinite"/></text><text x="20" y="140" font-family="monospace" font-size="13" fill="#36BCF7">print(hello())<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.53;0.67;1" dur="3s" repeatCount="indefinite"/></text><rect x="20" y="150" width="8" height="15" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></svg>